<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor ISP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-4">

    <!-- Pantalla de inicio de sesión (visible hasta que haya sesión activa) -->
    <div id="login-box" class="max-w-sm mx-auto bg-white p-6 rounded shadow mt-20">
        <h1 class="text-xl font-bold mb-4">Monitor ISP — Iniciar sesión</h1>
        <input id="login-email" type="email" placeholder="Correo" class="border w-full p-2 mb-2 rounded">
        <input id="login-password" type="password" placeholder="Contraseña" class="border w-full p-2 mb-2 rounded">
        <button onclick="iniciarSesion()" class="bg-blue-600 text-white w-full p-2 rounded">Entrar</button>
        <p id="login-error" class="text-red-500 text-sm mt-2"></p>
    </div>

    <!-- Dashboard (oculto hasta iniciar sesión) -->
    <div id="dashboard" class="max-w-4xl mx-auto hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Monitor ISP — Estado de clientes</h1>
            <div>
                <button onclick="toggleFormularioAlta()" class="text-sm bg-blue-600 text-white px-3 py-1 rounded mr-3">+ Nuevo cliente</button>
                <button onclick="cerrarSesion()" class="text-sm text-red-600">Cerrar sesión</button>
            </div>
        </div>

        <!-- Formulario de alta (oculto por defecto) -->
        <div id="form-alta" class="bg-white p-4 rounded shadow mb-4 hidden">
            <h2 class="text-lg font-semibold mb-2">Registrar cliente nuevo</h2>
            <input id="alta-nombre" type="text" placeholder="Nombre del cliente" class="border w-full p-2 mb-2 rounded">
            <input id="alta-pppoe" type="text" placeholder="Usuario PPPoE" class="border w-full p-2 mb-2 rounded">
            <input id="alta-pon" type="text" placeholder="Número de PON (opcional)" class="border w-full p-2 mb-2 rounded">
            <div class="flex gap-2 mb-2">
                <input id="alta-lat" type="text" placeholder="Latitud (opcional)" class="border w-1/2 p-2 rounded">
                <input id="alta-lng" type="text" placeholder="Longitud (opcional)" class="border w-1/2 p-2 rounded">
            </div>
            <button onclick="darDeAltaCliente()" class="bg-green-600 text-white px-4 py-2 rounded">Guardar cliente</button>
            <p id="alta-mensaje" class="text-sm mt-2"></p>
        </div>

        <div class="bg-white p-4 rounded shadow mb-4">
            <canvas id="grafico" width="400" height="200"></canvas>
        </div>
        <div class="bg-white p-4 rounded shadow">
            <h2 class="text-xl font-semibold mb-2">Detalle</h2>
            <div id="lista-clientes"></div>
        </div>
    </div>

    <script>
        // ⚠️ Reemplaza estos dos valores con los tuyos:
        const SUPABASE_URL = "https://fiutwgogaatwhcehhewr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpdXR3Z29nYWF0d2hjZWhoZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDQ0MTAsImV4cCI6MjA5ODU4MDQxMH0.3UwYw9569iexdPb93IWBYkzCkdIe1QaI843xfNLaCHc";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let chartInstance = null;
        let intervaloActivo = null;

        function colorEstado(estado) {
            if (estado === "conectado") return "bg-green-500";
            if (estado === "suspendido") return "bg-gray-400";
            return "bg-red-500";
        }

        async function iniciarSesion() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            document.getElementById('login-error').innerText = error ? error.message : '';
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
        }

        async function cargarDatos() {
            try {
                const { data, error } = await supabaseClient
                    .from('estados_actuales')
                    .select('cliente_id,estado,session_uptime,updated_at,clientes(nombre,pppoe_user)');

                if (error) { console.error('Error cargando datos:', error); return; }

                const conectados = data.filter(d => d.estado === "conectado").length;
                const desconectados = data.filter(d => d.estado === "desconectado").length;
                const suspendidos = data.filter(d => d.estado === "suspendido").length;

                const ctx = document.getElementById('grafico').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Conectados', 'Desconectados', 'Suspendidos'],
                        datasets: [{
                            data: [conectados, desconectados, suspendidos],
                            backgroundColor: ['#34d399', '#f87171', '#9ca3af']
                        }]
                    }
                });

                const lista = document.getElementById('lista-clientes');
                lista.innerHTML = `
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-gray-200">
                                <th class="p-2 text-left">Cliente</th>
                                <th class="p-2 text-left">Usuario PPPoE</th>
                                <th class="p-2 text-left">Estado</th>
                                <th class="p-2 text-left">Tiempo de sesión</th>
                                <th class="p-2 text-left">Última actualización</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(d => `
                                <tr class="border-b">
                                    <td class="p-2">${d.clientes.nombre}</td>
                                    <td class="p-2">${d.clientes.pppoe_user}</td>
                                    <td class="p-2">
                                        <span class="inline-block w-3 h-3 rounded-full ${colorEstado(d.estado)}"></span>
                                        ${d.estado}
                                    </td>
                                    <td class="p-2">${d.session_uptime || '-'}</td>
                                    <td class="p-2">${new Date(d.updated_at).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                console.error('Error cargando datos:', e);
            }
        }

        function toggleFormularioAlta() {
            document.getElementById('form-alta').classList.toggle('hidden');
            document.getElementById('alta-mensaje').innerText = '';
        }

        async function darDeAltaCliente() {
            const nombre = document.getElementById('alta-nombre').value.trim();
            const pppoeUser = document.getElementById('alta-pppoe').value.trim();
            const pon = document.getElementById('alta-pon').value.trim();
            const lat = document.getElementById('alta-lat').value.trim();
            const lng = document.getElementById('alta-lng').value.trim();
            const mensaje = document.getElementById('alta-mensaje');

            if (!nombre || !pppoeUser) {
                mensaje.className = 'text-sm mt-2 text-red-600';
                mensaje.innerText = 'Nombre y usuario PPPoE son obligatorios.';
                return;
            }

            const { error } = await supabaseClient.from('clientes').insert({
                nombre: nombre,
                pppoe_user: pppoeUser,
                pon: pon || null,
                lat: lat ? parseFloat(lat) : null,
                lng: lng ? parseFloat(lng) : null
            });

            if (error) {
                mensaje.className = 'text-sm mt-2 text-red-600';
                if (error.code === '23505') {  // violación de UNIQUE
                    mensaje.innerText = 'Ya existe un cliente con ese usuario PPPoE.';
                } else {
                    mensaje.innerText = 'Error al guardar: ' + error.message;
                }
                return;
            }

            mensaje.className = 'text-sm mt-2 text-green-600';
            mensaje.innerText = 'Cliente registrado correctamente.';
            document.getElementById('alta-nombre').value = '';
            document.getElementById('alta-pppoe').value = '';
            document.getElementById('alta-pon').value = '';
            document.getElementById('alta-lat').value = '';
            document.getElementById('alta-lng').value = '';

            cargarDatos();  // refresca la gráfica y la tabla con el nuevo cliente
        }

        // Alterna entre pantalla de login y dashboard según el estado de la sesión
        supabaseClient.auth.onAuthStateChange((_event, session) => {
            const haySesion = !!session;
            document.getElementById('login-box').classList.toggle('hidden', haySesion);
            document.getElementById('dashboard').classList.toggle('hidden', !haySesion);

            if (haySesion && !intervaloActivo) {
                cargarDatos();
                intervaloActivo = setInterval(cargarDatos, 30000);
            } else if (!haySesion && intervaloActivo) {
                clearInterval(intervaloActivo);
                intervaloActivo = null;
            }
        });
    </script>
</body>
</html>
